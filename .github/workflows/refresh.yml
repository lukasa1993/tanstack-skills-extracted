name: Refresh extracted skills

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-extracted-tanstack-skills
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'lukasa1993/tanstack-skills-extracted' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Restore source cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tanstack-source-cache
          key: sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sources-v1-${{ runner.os }}-

      - name: Test refresh pipeline
        run: |
          ./extractor.sh --self-test
          node --test ./scripts/*.test.mjs

      - name: Acquire, build, validate, and apply candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/refresh.mjs

      - name: Commit validated output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A -- skills skills.sh.json .claude-plugin/marketplace.json sources.lock.json
          if git diff --cached --quiet; then
            echo "Generated output and source snapshot are unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh extracted TanStack skills"
          # A concurrent edit to main rejects this push. Rebuild against it on rerun.
          git -c credential.helper='!gh auth git-credential' push origin HEAD:main

      - name: Save verified downloads, including after failed builds
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tanstack-source-cache
          key: sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-diagnostics-${{ github.run_attempt }}
          path: |
            .tanstack-refresh/report.json
            .tanstack-refresh/run-*/*.log
            .tanstack-refresh/run-*/sources.lock.json
          include-hidden-files: true
          retention-days: 14
