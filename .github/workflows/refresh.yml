name: Refresh extracted skills

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-extracted-tanstack-skills
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'lukasa1993/tanstack-skills-extracted' && github.ref == 'refs/heads/main'
    runs-on: tanstack-skills
    timeout-minutes: 30
    outputs:
      publish_needed: ${{ steps.release.outputs.needed }}
      release_version: ${{ steps.release.outputs.version }}
      publish_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check runner tools
        run: |
          set -euo pipefail
          node --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 20)) throw new Error("Node.js 22.20.0 or newer is required")'
          npm --version
          tar --version
          gh --version
          gh skill publish --help >/dev/null

      - name: Test exporter
        run: ./extractor.sh --self-test

      - name: Extract current official skills
        run: ./extractor.sh skills

      - name: Fetch current official documentation
        run: node ./scripts/fetch-doc-sources.mjs

      - name: Build product skills and metadata
        run: node ./scripts/build-groups.mjs

      - name: Validate product catalog and discovery
        env:
          EXPECTED_PRODUCT_SKILLS: tanstack-start,tanstack-router,tanstack-query,tanstack-db,tanstack-store,tanstack-ai,tanstack-table,tanstack-charts,tanstack-form,tanstack-hotkeys,tanstack-markdown,tanstack-highlight,tanstack-virtual,tanstack-pacer,tanstack-devtools,tanstack-config,tanstack-cli,tanstack-intent
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const expected = process.env.EXPECTED_PRODUCT_SKILLS.split(',')
          const markerName = '.tanstack-product-skill.json'
          const markerSkills = fs
            .readdirSync('skills', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .filter((name) => fs.existsSync(path.join('skills', name, markerName)))
            .sort()
          const expectedSorted = [...expected].sort()

          if (JSON.stringify(markerSkills) !== JSON.stringify(expectedSorted)) {
            throw new Error(
              `Product marker mismatch. Expected ${expectedSorted.join(', ')}, got ${markerSkills.join(', ')}`,
            )
          }

          for (const name of markerSkills) {
            JSON.parse(fs.readFileSync(path.join('skills', name, markerName), 'utf8'))
            if (!fs.existsSync(path.join('skills', name, 'SKILL.md'))) {
              throw new Error(`Missing skills/${name}/SKILL.md`)
            }
          }

          const exportManifest = fs.readFileSync('skills/.tanstack-skills-export.tsv', 'utf8')
          const atomicSkills = exportManifest
            .split('\n')
            .filter((line) => line && !line.startsWith('#') && !line.startsWith('package\t'))
            .flatMap((line) => (line.split('\t')[5] ?? '').split(',').filter(Boolean))
          if (!atomicSkills.length || new Set(atomicSkills).size !== atomicSkills.length) {
            throw new Error('Exporter manifest has no atomic skills or contains duplicate names.')
          }
          for (const name of atomicSkills) {
            const skillPath = path.join('skills', name, 'SKILL.md')
            const source = fs.readFileSync(skillPath, 'utf8')
            const frontmatter = /^---\n([\s\S]*?)\n---/.exec(source)?.[1] ?? ''
            if (!/^  internal:\s*true\s*$/m.test(frontmatter)) {
              throw new Error(`Atomic skill is visible in the default picker: ${name}`)
            }
          }

          const discovered = fs
            .readdirSync('skills', { withFileTypes: true })
            .filter((entry) => entry.isDirectory() && fs.existsSync(path.join('skills', entry.name, 'SKILL.md')))
            .map((entry) => entry.name)
          const allowed = new Set([...expected, ...atomicSkills])
          const unexpected = discovered.filter((name) => !allowed.has(name))
          if (unexpected.length) throw new Error(`Unexpected skill directories: ${unexpected.join(', ')}`)

          const catalog = JSON.parse(fs.readFileSync('skills.sh.json', 'utf8'))
          const listed = (catalog.groupings ?? []).flatMap((group) => group.skills ?? [])
          if (JSON.stringify(listed) !== JSON.stringify(expected)) {
            throw new Error(
              `Public catalog mismatch. Expected ${expected.join(', ')}, got ${listed.join(', ')}`,
            )
          }

          console.log(`Validated ${expected.length} product skills.`)
          NODE
          npx --yes skills@1.5.22 add . --list

      - name: Validate Agent Skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          generated=(skills skills.sh.json .claude-plugin/marketplace.json)
          git add -A -- "${generated[@]}"
          if git diff --cached --quiet -- "${generated[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changed skills
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh extracted TanStack skills"
          git -c credential.helper='!gh auth git-credential' push origin HEAD:main

      - name: Select release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          generated=(skills skills.sh.json .claude-plugin/marketplace.json)
          publish_sha="$(git log -1 --format=%H -- "${generated[@]}")"
          skill_commit_count="$(git rev-list --count "$publish_sha" -- "${generated[@]}")"
          version="v0.1.${skill_commit_count}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$publish_sha" >> "$GITHUB_OUTPUT"
          if ! gh release view "$version" >/dev/null 2>&1; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: refresh
    if: needs.refresh.outputs.publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out published main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.refresh.outputs.publish_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify published skills are current
        env:
          EXPECTED_SHA: ${{ needs.refresh.outputs.publish_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          generated=(skills skills.sh.json .claude-plugin/marketplace.json)
          if ! git diff --quiet "$EXPECTED_SHA" origin/main -- "${generated[@]}"; then
            echo "The published skills or metadata on main changed after the refresh job." >&2
            exit 1
          fi

      - name: Refresh skills.sh index
        env:
          EXPECTED_PRODUCT_SKILLS: tanstack-start,tanstack-router,tanstack-query,tanstack-db,tanstack-store,tanstack-ai,tanstack-table,tanstack-charts,tanstack-form,tanstack-hotkeys,tanstack-markdown,tanstack-highlight,tanstack-virtual,tanstack-pacer,tanstack-devtools,tanstack-config,tanstack-cli,tanstack-intent
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "${RUNNER_TEMP}/skills-sh-install.XXXXXX")"
          cd "$install_dir"

          IFS=',' read -r -a expected_skills <<< "$EXPECTED_PRODUCT_SKILLS"
          mapfile -t marker_files < <(
            find "$GITHUB_WORKSPACE/skills" -mindepth 2 -maxdepth 2 \
              -name '.tanstack-product-skill.json' -type f | LC_ALL=C sort
          )
          if (( ${#marker_files[@]} != ${#expected_skills[@]} )); then
            echo "Expected ${#expected_skills[@]} product markers, found ${#marker_files[@]}." >&2
            exit 1
          fi

          batch=()
          batch_count=0
          published_count=0
          for skill_name in "${expected_skills[@]}"; do
            marker_file="$GITHUB_WORKSPACE/skills/$skill_name/.tanstack-product-skill.json"
            if [[ ! -f "$marker_file" ]]; then
              echo "Missing product marker for $skill_name." >&2
              exit 1
            fi
            batch+=(--skill "$skill_name")
            batch_count=$((batch_count + 1))
            published_count=$((published_count + 1))
            if (( batch_count == 8 )); then
              npx --yes skills@1.5.22 add "$GITHUB_REPOSITORY" --agent codex --copy --yes "${batch[@]}"
              batch=()
              batch_count=0
            fi
          done
          if (( batch_count > 0 )); then
            npx --yes skills@1.5.22 add "$GITHUB_REPOSITORY" --agent codex --copy --yes "${batch[@]}"
          fi
          echo "Reported $published_count product skills to skills.sh."

      - name: Publish GitHub skill release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.refresh.outputs.release_version }}
          PUBLISH_SHA: ${{ needs.refresh.outputs.publish_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$RELEASE_VERSION" \
            -f target_commitish="$PUBLISH_SHA" \
            -F generate_release_notes=true \
            --jq .html_url
