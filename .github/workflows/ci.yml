name: Validate refresh pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate shell, exporter, and pipeline behavior
        run: |
          bash -n extractor.sh
          ./extractor.sh --self-test
          node --test ./scripts/*.test.mjs
          node scripts/validate-catalog.mjs
          node scripts/validate-guidance.mjs
      - name: Install pinned acceptance dependencies
        run: npm ci --prefix acceptance --ignore-scripts --no-audit --no-fund
      - name: Exercise installed skill examples
        run: npm test --prefix acceptance
      - name: Exercise publishing with the pinned skills installer
        run: node --test acceptance/publish.test.mjs
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
